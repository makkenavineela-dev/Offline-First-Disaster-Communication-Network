<!DOCTYPE html>
<html>
  <head>
    <title>RESQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body { margin: 0; background: #0a0a0a; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 12px; }
      .logo { font-family: sans-serif; font-size: 36px; font-weight: 900; color: #FF1F1F; letter-spacing: 4px; }
      p    { color: #555; font-family: sans-serif; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="logo">RESQ</div>
    <p>Loading…</p>
    <script>
      var mobile  = localStorage.getItem('resq_mobile');
      var channel = localStorage.getItem('resq_verify_channel');
      if (mobile && channel) {
        window.location.replace('/dashboard/index.html');
      } else {
        window.location.replace('/login/index.html');
      }
    </script>
  </body>
</html>
