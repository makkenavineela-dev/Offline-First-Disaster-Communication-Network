<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>RESQ — Map</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../leaflet/leaflet.css" />
<script src="../leaflet/leaflet.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --red: #FF1F1F; --amber: #FFAA00; --green: #00E676; --blue: #2979FF;
    --white: #F5F5F0; --black: #0A0A0A; --gray: #141414;
    --gray2: #1E1E1E; --gray3: #2A2A2A; --text-muted: #666;
  }
  html, body { height: 100%; background: #080808; font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .phone {
    width: 100%; height: 100%; background: var(--black);
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    
  }
  /* MAP CANVAS */
  .map-area {
    flex: 1; position: relative; overflow: hidden;
    background: #0d1117;
  }
  #map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #0d1117;
    touch-action: manipulation;
  }
  /* Optional leaflet attribution dark theme patch */
  .leaflet-container { font-family: 'Barlow', sans-serif !important; }
  .leaflet-bar { border: none !important; }

  /* Floating top controls */
  .map-header {
    position: absolute; top: 52px; left: 0; right: 0;
    padding: 0 16px; z-index: 400;
    display: flex; align-items: center; gap: 10px;
  }
  .back-btn {
    width: 38px; height: 38px; border-radius: 12px;
    background: rgba(20,20,20,0.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-decoration: none; flex-shrink: 0;
  }
  .back-btn svg { width: 18px; height: 18px; fill: var(--white); }
  .map-search {
    flex: 1; background: rgba(20,20,20,0.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 10px 14px; display: flex; align-items: center; gap: 8px;
  }
  .map-search svg { width: 16px; height: 16px; fill: var(--text-muted); flex-shrink: 0; }
  .map-search-text { font-size: 13px; color: var(--text-muted); }

  /* Filter chips */
  .filter-chips {
    position: absolute; top: 108px; left: 0; right: 0;
    padding: 0 16px; z-index: 400;
    display: flex; gap: 6px; overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 7px 14px; border-radius: 100px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid;
    backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 5px;
    transition: all 0.15s;
    opacity: 0.5;                        /* inactive filters are dimmed */
  }
  .chip:active { transform: scale(0.95); }
  .chip.active { opacity: 1; font-weight: 700; }
  .chip.all { background: rgba(255,31,31,0.15); border-color: rgba(255,31,31,0.4); color: var(--red); }
  .chip.people { background: rgba(41,121,255,0.12); border-color: rgba(41,121,255,0.4); color: var(--blue); }
  .chip.sos { background: rgba(255,31,31,0.12); border-color: rgba(255,31,31,0.4); color: var(--red); }
  .chip.nodes { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); color: var(--white); }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Zoom controls */
  .zoom-controls {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    z-index: 400; display: flex; flex-direction: column; gap: 4px;
  }
  .zoom-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(20,20,20,0.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--white);
    font-size: 20px; font-weight: 300;
  }

  /* My location btn */
  .my-loc-btn {
    position: absolute; right: 16px; top: 158px; z-index: 400;
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(20,20,20,0.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .my-loc-btn svg { width: 20px; height: 20px; fill: var(--amber); }

  /* Offline Download btn */
  .offline-dl-btn {
    position: absolute; right: 16px; top: 210px; z-index: 400;
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(20,20,20,0.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .offline-dl-btn svg { width: 20px; height: 20px; fill: var(--green); }
  .offline-dl-btn.syncing { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  @keyframes sosPulse { 0%,100% { box-shadow: 0 0 6px #FF1F1F88; } 50% { box-shadow: 0 0 18px #FF1F1F; } }

  /* Bottom panel */
  .bottom-panel {
    /* Sit flush on top of the bottom nav (nav = 56px content + safe-area inset).
       Tracks the nav height so no gap/strip shows on any device. */
    position: absolute; bottom: calc(56px + max(8px, env(safe-area-inset-bottom))); left: 0; right: 0;
    background: rgba(10,10,10,0.96); backdrop-filter: blur(20px);
    border-top: 1px solid var(--gray3);
    border-radius: 0; padding: 12px 16px;
    z-index: 400;
  }
  .panel-handle { width: 36px; height: 3px; background: var(--gray3); border-radius: 2px; margin: 0 auto 12px; }
  .stats-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-pill {
    flex: 1; background: var(--gray2); border: 1px solid var(--gray3);
    border-radius: 12px; padding: 10px; text-align: center;
  }
  .stat-pill-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; color: var(--white);
  }
  .stat-pill-val.green { color: var(--green); }
  .stat-pill-val.amber { color: var(--amber); }
  .stat-pill-val.red { color: var(--red); }
  .stat-pill-label { font-size: 9px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  /* Nearby items */
  .nearby-list { display: flex; flex-direction: column; gap: 6px; }
  .nearby-item {
    background: var(--gray2); border: 1px solid var(--gray3);
    border-radius: 12px; padding: 10px 12px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
  }
  .nearby-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .nearby-icon.shelter { background: rgba(0,230,118,0.15); }
  .nearby-icon.hazard { background: rgba(255,170,0,0.15); }
  .nearby-icon.sos { background: rgba(255,31,31,0.15); }
  .nearby-info { flex: 1; }
  .nearby-name { font-size: 13px; font-weight: 600; color: var(--white); }
  .nearby-dist { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .nearby-arrow { margin-left: auto; }
  .nearby-arrow svg { width: 16px; height: 16px; fill: var(--text-muted); }

  /* Bottom nav */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,0.97);
    backdrop-filter: blur(20px); border-top: 1px solid var(--gray3);
    display: flex; align-items: stretch;
    padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 400;
  }
  .nav-item { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; text-decoration: none; padding: 10px 2px; }
  .nav-item svg { width: 22px; height: 22px; fill: var(--text-muted); transition: fill .15s; flex-shrink: 0; }
  .nav-label { font-size: 10px; line-height: 1; color: var(--text-muted); letter-spacing: .3px; transition: color .15s; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item.active svg { fill: var(--red); }
  .nav-item.active .nav-label { color: var(--red); }
  .nav-item.active::before { content: ''; position: absolute; top: 0; left: 50%; width: 26px; height: 3px; transform: translateX(-50%); background: var(--red); border-radius: 0 0 3px 3px; }

  /* Map Item Detail Overlay */
  .detail-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; top: 0;
    background: rgba(0,0,0,0.8); z-index: 500;
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: auto; }
  .detail-card {
    background: #111; padding: 24px; border-radius: 30px 30px 0 0;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
  }
  .detail-overlay.open .detail-card { transform: translateY(0); }
  
  .detail-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 16px; background: var(--gray3);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .detail-close svg { width: 14px; height: 14px; fill: white; }
  
  .detail-icon-wrap {
    width: 60px; height: 60px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 32px;
    margin-bottom: 16px;
  }
  .detail-icon-wrap.shelter { background: rgba(0,230,118,0.15); }
  .detail-icon-wrap.sos { background: rgba(255,31,31,0.15); }
  .detail-icon-wrap.hazard { background: rgba(255,170,0,0.15); }

  .detail-title { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: white; line-height: 1.1; margin-bottom: 6px; }
  .detail-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .detail-meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gray3); }
  
  .detail-desc { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.5; margin-bottom: 24px; }
  
  .detail-action-btn {
    width: 100%; padding: 16px; border-radius: 16px; background: var(--blue); color: white;
    font-size: 16px; font-weight: 700; border: none; cursor: pointer; margin-bottom: 20px;
    transition: background 0.2s, transform 0.1s;
  }
  .detail-action-btn:active { transform: scale(0.97); }
</style>

<script>
let map;
let myLocationMarker;

// Offline tile cache. Reuses the service-worker cache name so PWA and native
// share one store. Crucially this also works inside the Capacitor WebView,
// where the service worker is intentionally NOT registered.
const TILE_CACHE = 'resq-map-tiles';

// A tile layer that survives going offline:
//   1. serve the tile from the offline cache if we have it (no network needed)
//   2. otherwise load it from the network as usual…
//   3. …and quietly stash it in the cache for the next time we're offline
// A tile that is both missing AND offline falls back to map-fallback.png
// (via errorTileUrl) instead of leaving a blank/black square.
const OfflineTileLayer = L.TileLayer.extend({
  createTile: function (coords, done) {
    const tile = document.createElement('img');
    tile.alt = '';
    L.DomEvent.on(tile, 'load',  L.Util.bind(this._tileOnLoad,  this, done, tile));
    L.DomEvent.on(tile, 'error', L.Util.bind(this._tileOnError, this, done, tile));
    // Free blob URLs once the image has painted so panning doesn't leak memory
    tile.addEventListener('load', function () {
      if (tile.src.indexOf('blob:') === 0) URL.revokeObjectURL(tile.src);
    });

    const url = this.getTileUrl(coords);

    (async () => {
      // 1) Offline cache first — this is what keeps the map visible with no signal
      if (window.caches) {
        try {
          const cache = await caches.open(TILE_CACHE);
          const hit = await cache.match(url);
          if (hit) { tile.src = URL.createObjectURL(await hit.blob()); return; }
        } catch (_) {}
      }
      // 2) Not cached → normal network load (online behaviour is unchanged)
      tile.src = url;
      // 3) Cache it in the background for future offline use
      if (window.caches) {
        fetch(url, { mode: 'cors' })
          .then(r => { if (r && r.ok) caches.open(TILE_CACHE).then(c => c.put(url, r)); })
          .catch(() => {});
      }
    })();

    return tile;
  }
});

// Lightweight toast for map feedback (location, offline download, errors)
function mapToast(msg, kind) {
  let el = document.getElementById('mapToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mapToast';
    el.style.cssText = 'position:absolute;top:150px;left:50%;transform:translateX(-50%);' +
      'z-index:600;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:600;' +
      'box-shadow:0 4px 16px rgba(0,0,0,.45);transition:opacity .3s;max-width:82%;' +
      'text-align:center;pointer-events:none;';
    (document.querySelector('.phone') || document.body).appendChild(el);
  }
  el.style.background = kind === 'warn' ? 'rgba(255,170,0,0.96)'
                      : kind === 'err'  ? 'rgba(255,31,31,0.96)'
                      :                   'rgba(0,230,118,0.96)';
  el.style.color = kind === 'err' ? '#fff' : '#000';
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2800);
}

function initMap() {
  console.log('Map Booting... [OFFLINE READY]');
  if (map) return;

  map = L.map('map', {
    zoomControl: false,
    attributionControl: false
  }).setView([12.941487207089997, 77.56582967529805], 15);

  // Single host (no {s} rotation) so the same tile is always cached under the
  // same URL — otherwise the offline cache misses on a/b/c subdomain swaps.
  new OfflineTileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    errorTileUrl: '/map/map-fallback.png'
  }).addTo(map);

  setTimeout(() => { map.invalidateSize(); }, 400);

  // My Location Marker (starts hidden until GPS fix)
  const myIcon = L.divIcon({
    className: 'custom-div-icon',
    html: `<div style="width:20px;height:20px;background:rgba(255,170,0,0.9);border:2px solid white;border-radius:50%;box-shadow:0 0 15px rgba(255,170,0,0.8);"></div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });
  myLocationMarker = L.marker([0, 0], { icon: myIcon, opacity: 0 }).addTo(map);

  // Zoom Controls
  const zoomBtns = document.querySelectorAll('.zoom-btn');
  if (zoomBtns.length >= 2) {
    zoomBtns[0].addEventListener('click', () => map.zoomIn());
    zoomBtns[1].addEventListener('click', () => map.zoomOut());
  }

  // My Location Button — now with clear feedback so it never fails silently
  document.querySelector('.my-loc-btn').addEventListener('click', async () => {
    if (!map) return;
    mapToast('Locating…', 'ok');

    const onOk = (lat, lng) => {
      map.setView([lat, lng], 16);
      if (myLocationMarker) myLocationMarker.setLatLng([lat, lng]).setOpacity(1);
      mapToast('Centered on your location', 'ok');
    };
    const onFail = (msg) => mapToast(msg || 'Location unavailable — enable GPS', 'warn');

    try {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation) {
        const pos = await window.Capacitor.Plugins.Geolocation.getCurrentPosition({ enableHighAccuracy: true, timeout: 10000 });
        onOk(pos.coords.latitude, pos.coords.longitude);
      } else if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => onOk(position.coords.latitude, position.coords.longitude),
          (err) => onFail(err && err.code === 1 ? 'Location permission denied — enable it in Settings' : 'Location unavailable — enable GPS'),
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        onFail('GPS not supported on this device');
      }
    } catch (e) {
      const denied = e && /denied|permission/i.test(e.message || '');
      onFail(denied ? 'Location permission denied — enable it in Settings' : 'Location unavailable — enable GPS');
    }
  });

  // Offline Map Downloader
  document.querySelector('.offline-dl-btn').addEventListener('click', async function() {
    const btn = this;
    if (btn.classList.contains('syncing')) return;
    if (!window.caches) { mapToast('Offline cache not supported here', 'warn'); return; }
    btn.classList.add('syncing');
    mapToast('Saving this area for offline…', 'ok');
    const bounds = map.getBounds();
    const zoom = map.getZoom();
    const layers = [zoom, zoom + 1, zoom + 2];

    // Collect tile URLs for the current view across a few zoom levels.
    const urls = [];
    const MAX_TILES = 400; // keep it reasonable — OSM is a shared free service
    for (const z of layers) {
      if (z > 19) continue;
      const nw = map.project(bounds.getNorthWest(), z).divideBy(256).floor();
      const se = map.project(bounds.getSouthEast(), z).divideBy(256).floor();
      for (let x = nw.x; x <= se.x; x++) {
        for (let y = nw.y; y <= se.y; y++) {
          urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
          if (urls.length >= MAX_TILES) break;
        }
        if (urls.length >= MAX_TILES) break;
      }
      if (urls.length >= MAX_TILES) break;
    }

    // Fetch + cache with limited concurrency so we don't hammer the tile server.
    const cache = await caches.open(TILE_CACHE);
    let i = 0, saved = 0;
    async function worker() {
      while (i < urls.length) {
        const u = urls[i++];
        try {
          const r = await fetch(u, { mode: 'cors' });
          if (r && r.ok) { await cache.put(u, r); saved++; }
        } catch (_) {}
      }
    }
    await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);

    btn.classList.remove('syncing');
    btn.style.background = 'var(--green)';
    setTimeout(() => { btn.style.background = ''; }, 2000);
    mapToast(saved > 0 ? `Saved ${saved} map tiles for offline ✓` : 'Could not reach tile server', saved > 0 ? 'ok' : 'warn');
  });

  setupGPS();
}

async function setupGPS() {
  if (!map || !myLocationMarker) return;
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation) {
    try {
      const Geo = window.Capacitor.Plugins.Geolocation;
      const pos = await Geo.getCurrentPosition({ enableHighAccuracy: true });
      myLocationMarker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
      map.setView([pos.coords.latitude, pos.coords.longitude], 15);
      Geo.watchPosition({ enableHighAccuracy: true }, (position) => {
        if (position) myLocationMarker.setLatLng([position.coords.latitude, position.coords.longitude]);
      });
    } catch (e) { console.warn("Hardware GPS failed.", e); }
  } else if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition((position) => {
      myLocationMarker.setLatLng([position.coords.latitude, position.coords.longitude]);
      map.setView([position.coords.latitude, position.coords.longitude], 15);
    }, (err) => { console.warn('Browser GPS Error:', err); }, { enableHighAccuracy: true });
  }
}

window.onload = initMap;
if (document.readyState === 'complete') initMap();

// ── Mesh map layer ────────────────────────────────────────────────────────────
const _nodeMarkers = {};  // userId → Leaflet marker
const _sosMarkers  = [];  // SOS markers

// Deduplicate nodes: one phone number = one person = one marker
function _dedupeNodes(nodes) {
  const seen = new Map();
  for (const n of nodes) {
    const key = (n.phone && n.phone.trim()) ? n.phone.trim() : n.userId;
    const existing = seen.get(key);
    if (!existing || (n.lastSeen || 0) > (existing.lastSeen || 0)) {
      seen.set(key, n);
    }
  }
  return Array.from(seen.values());
}

function _roleColor(role) {
  if (role === 'responder' || role === 'first_responder') return '#2979FF';
  if (role === 'medical')   return '#00E676';
  if (role === 'coordinator') return '#FFAA00';
  return '#F5F5F0'; // civilian
}

function _makeNodeIcon(name, role) {
  const initials = (name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
  const color = _roleColor(role);
  return L.divIcon({
    className: 'custom-div-icon',
    html: `<div style="width:30px;height:30px;background:rgba(10,10,10,0.85);border:2px solid ${color};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${color};box-shadow:0 0 8px ${color}55;">${initials}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
  });
}

function _makeSosIcon() {
  return L.divIcon({
    className: 'custom-div-icon',
    html: `<div style="width:32px;height:32px;background:rgba(255,31,31,0.2);border:2px solid #FF1F1F;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#FF1F1F;animation:sosPulse 1s ease-in-out infinite;">SOS</div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
}

function _addNodeMarker(node) {
  if (!map || node.lat == null || node.lng == null) return;
  if (_nodeMarkers[node.userId]) {
    _nodeMarkers[node.userId].setLatLng([node.lat, node.lng]);
    return;
  }
  const marker = L.marker([node.lat, node.lng], { icon: _makeNodeIcon(node.name, node.role) })
    .addTo(map)
    .bindPopup(`<b>${node.name || 'Unknown'}</b><br>${node.role || 'civilian'}`);
  _nodeMarkers[node.userId] = marker;
  if (_mapFilter === 'sos') map.removeLayer(marker);   // respect the active filter button
}

function _removeNodeMarker(userId) {
  if (_nodeMarkers[userId]) {
    map.removeLayer(_nodeMarkers[userId]);
    delete _nodeMarkers[userId];
  }
}

function _addSosMarker(alert) {
  if (!map || alert.lat == null || alert.lng == null) return;
  const marker = L.marker([alert.lat, alert.lng], { icon: _makeSosIcon() })
    .addTo(map)
    .bindPopup(`<b>SOS — ${alert.fromName || 'Unknown'}</b><br>${alert.message || alert.alertType || ''}`);
  _sosMarkers.push(marker);
  if (_mapFilter === 'people') map.removeLayer(marker);   // respect the active filter button
}

// ── Real filter buttons (All / People / SOS) ────────────────────────────────
let _mapFilter = 'all';
function _showMarker(m, show) {
  if (!map || !m) return;
  if (show) { if (!map.hasLayer(m)) m.addTo(map); }
  else      { if (map.hasLayer(m)) map.removeLayer(m); }
}
function applyMapFilter(filter) {
  _mapFilter = filter;
  document.querySelectorAll('.filter-chips .chip').forEach(c =>
    c.classList.toggle('active', c.getAttribute('data-filter') === filter));
  const showPeople = (filter === 'all' || filter === 'people');
  const showSos    = (filter === 'all' || filter === 'sos');
  Object.keys(_nodeMarkers).forEach(id => _showMarker(_nodeMarkers[id], showPeople));
  _sosMarkers.forEach(m => _showMarker(m, showSos));
}
window.applyMapFilter = applyMapFilter;

// Update stats row and nearby list
function _refreshMapStats(nodes) {
  const sosCount = _sosMarkers.length;
  document.getElementById('mapStatSOS').textContent    = sosCount;
  document.getElementById('mapStatPeople').textContent = nodes.length;

  const list = document.getElementById('mapNearbyList');
  if (!list) return;
  list.innerHTML = '';

  if (!nodes.length) {
    list.innerHTML = '<div style="text-align:center;padding:20px 0;color:var(--text-muted);font-size:12px;">No nearby nodes detected</div>';
    return;
  }

  for (const node of nodes) {
    const item = document.createElement('div');
    item.className = 'nearby-item';
    item.innerHTML = `
      <div class="nearby-icon people" style="background:rgba(41,121,255,0.15);border:1px solid rgba(41,121,255,0.3);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#2979FF;">
        ${(node.name||'?').slice(0,2).toUpperCase()}
      </div>
      <div class="nearby-info">
        <div class="nearby-name">${node.name || 'Unknown'}</div>
        <div class="nearby-dist">${node.role || 'civilian'} · ${node.status || 'active'}</div>
      </div>
      <div class="nearby-arrow"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></div>`;
    if (node.lat != null) {
      item.onclick = () => map && map.setView([node.lat, node.lng], 16);
    }
    list.appendChild(item);
  }
}

// Wire mesh once loaded
function wireMeshMap() {
  if (!window.RESQ_Mesh) { setTimeout(wireMeshMap, 200); return; }

  // Load already-known nodes (deduplicated)
  const nodes = _dedupeNodes(RESQ_Mesh.getNodes());
  nodes.forEach(_addNodeMarker);
  _refreshMapStats(nodes);

  // Load SOS history markers
  RESQ_Mesh.getSOSHistory().forEach(_addSosMarker);

  RESQ_Mesh.on('nodes', (raw) => {
    const deduped = _dedupeNodes(raw);
    deduped.forEach(_addNodeMarker);
    _refreshMapStats(deduped);
  });

  RESQ_Mesh.on('node_joined', () => {
    const deduped = _dedupeNodes(RESQ_Mesh.getNodes());
    deduped.forEach(_addNodeMarker);
    _refreshMapStats(deduped);
  });

  RESQ_Mesh.on('node_left', (data) => {
    _removeNodeMarker(data.userId);
    _refreshMapStats(_dedupeNodes(RESQ_Mesh.getNodes()));
  });

  RESQ_Mesh.on('location_update', (data) => {
    if (_nodeMarkers[data.userId]) {
      _nodeMarkers[data.userId].setLatLng([data.lat, data.lng]);
    } else {
      _addNodeMarker(data);
    }
  });

  RESQ_Mesh.on('sos', (alert) => {
    _addSosMarker(alert);
    _refreshMapStats(RESQ_Mesh.getNodes());
    // Pan to SOS location
    if (map && alert.lat != null) map.setView([alert.lat, alert.lng], 15);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', wireMeshMap);
} else {
  wireMeshMap();
}

function openMapDetail(titleKey, iconHtml, type, distKey, descKey) {
    document.getElementById('detailTitle').setAttribute('data-i18n', titleKey);
    document.getElementById('detailIcon').innerText = iconHtml;
    document.getElementById('detailIcon').className = `detail-icon-wrap ${type}`;
    document.getElementById('detailDist').setAttribute('data-i18n', distKey);
    document.getElementById('detailDesc').setAttribute('data-i18n', descKey);
    if (typeof changeLanguage === 'function') {
        changeLanguage(localStorage.getItem('appLang') || 'en');
    }
    document.getElementById('mapDetailOverlay').classList.add('open');
}

function closeMapDetail() {
    document.getElementById('mapDetailOverlay').classList.remove('open');
}
