<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RESQ — Resources</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --red: #FF1F1F; --amber: #FFAA00; --green: #00E676; --blue: #2979FF;
  --white: #F5F5F0; --black: #0A0A0A; --gray: #141414;
  --gray2: #1E1E1E; --gray3: #2A2A2A; --text-muted: #666;
}
html, body { height: 100%; background: var(--black); font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }

.phone {
  width: 100%; max-width: 480px; margin: 0 auto; height: 100%;
  position: relative; overflow: hidden;
  background: var(--black); display: flex; flex-direction: column;
}

.header {
  padding: max(12px, env(safe-area-inset-top)) 20px 12px;
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  border-bottom: 1px solid var(--gray3);
}
.back-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--gray2); display: flex; align-items: center;
  justify-content: center; cursor: pointer; text-decoration: none; flex-shrink: 0;
}
.back-btn svg { width: 18px; height: 18px; fill: var(--white); }
.header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px; font-weight: 900; color: var(--white); letter-spacing: 2px; flex: 1;
}
.header-title span { color: var(--green); }
.add-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--green); border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.add-btn svg { width: 20px; height: 20px; fill: #000; }

.tabs { display: flex; padding: 10px 16px 8px; gap: 6px; flex-shrink: 0; }
.tab {
  flex: 1; padding: 8px 4px; border-radius: 10px;
  font-size: 12px; font-weight: 600; text-align: center; cursor: pointer;
  border: 1px solid var(--gray3); color: var(--text-muted); transition: all 0.15s;
}
.tab.active { background: var(--green); border-color: var(--green); color: #000; }

.content { flex: 1; overflow-y: auto; padding: 0 16px 100px; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }

.summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 0 6px; }
.sum-card { background: var(--gray2); border: 1px solid var(--gray3); border-radius: 12px; padding: 10px 8px; text-align: center; }
.sum-icon  { font-size: 20px; }
.sum-label { font-size: 9px; letter-spacing: 1px; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; }
.sum-val   { font-size: 11px; font-weight: 700; margin-top: 3px; }
.sum-val.ok       { color: var(--green); }
.sum-val.low      { color: var(--amber); }
.sum-val.critical { color: var(--red); }

.section-label { font-size: 10px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin: 14px 0 8px; }

.res-card { background: var(--gray2); border: 1px solid var(--gray3); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.res-card.mine { border-color: rgba(0,230,118,0.3); }
.res-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.res-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.res-info { flex: 1; min-width: 0; }
.res-name { font-size: 15px; font-weight: 700; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.res-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
.res-status.OK       { background: rgba(0,230,118,0.15); color: var(--green); }
.res-status.LOW      { background: rgba(255,170,0,0.15);  color: var(--amber); }
.res-status.CRITICAL { background: rgba(255,31,31,0.15);  color: var(--red); }

.res-qty-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.res-qty-bar-wrap { flex: 1; height: 6px; background: var(--gray3); border-radius: 3px; overflow: hidden; }
.res-qty-bar { height: 100%; border-radius: 3px; transition: width 0.4s; }
.res-qty-text { font-size: 12px; font-weight: 600; color: var(--white); white-space: nowrap; }

.res-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.res-btn {
  flex: 1; min-width: 80px; padding: 8px 10px; border-radius: 10px; border: none;
  font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  transition: opacity 0.15s, transform 0.1s;
}
.res-btn:active { transform: scale(0.97); }
.res-btn.edit    { background: rgba(41,121,255,0.15); color: var(--blue); }
.res-btn.delete  { background: rgba(255,31,31,0.12);  color: var(--red); }
.res-btn.request { background: rgba(255,170,0,0.12);  color: var(--amber); }

.empty-state { text-align: center; padding: 60px 24px; }
.empty-icon  { font-size: 44px; opacity: 0.2; margin-bottom: 14px; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.empty-sub   { font-size: 12px; color: var(--text-muted); line-height: 1.6; }

/* overlay */
.overlay-backdrop {
  display: none; position: absolute; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 40; align-items: flex-end;
}
.overlay-backdrop.open { display: flex; }
.overlay-sheet {
  width: 100%; background: var(--gray);
  border-radius: 24px 24px 0 0; padding: 20px 20px max(24px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px;
  animation: sheetUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; color: var(--white); letter-spacing: 1px; margin-bottom: 4px; }
.sheet-title span { color: var(--green); }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
.form-input {
  background: var(--gray2); border: 1px solid var(--gray3);
  border-radius: 12px; padding: 12px 14px;
  color: var(--white); font-family: 'Barlow', sans-serif; font-size: 15px; outline: none;
  transition: border-color 0.2s; width: 100%; -webkit-appearance: none;
}
.form-input::placeholder { color: var(--text-muted); }
.form-input:focus { border-color: var(--green); }
.form-row { display: flex; gap: 10px; }
.form-row .form-field { flex: 1; }
.status-row { display: flex; gap: 8px; }
.status-pill {
  flex: 1; padding: 10px 4px; border-radius: 10px; text-align: center;
  font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid var(--gray3);
  color: var(--text-muted); transition: all 0.15s;
}
.status-pill.sel-OK       { border-color: var(--green);  color: var(--green); background: rgba(0,230,118,0.08); }
.status-pill.sel-LOW      { border-color: var(--amber);  color: var(--amber); background: rgba(255,170,0,0.08); }
.status-pill.sel-CRITICAL { border-color: var(--red);    color: var(--red);   background: rgba(255,31,31,0.08); }
.submit-btn {
  width: 100%; height: 52px; background: var(--green); border: none; border-radius: 14px;
  color: #000; font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px; font-weight: 900; letter-spacing: 2px; cursor: pointer;
}
.submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.cancel-link { text-align: center; font-size: 13px; color: var(--text-muted); cursor: pointer; }

/* toast */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
  z-index: 99; pointer-events: none; white-space: nowrap;
}
.toast.ok   { background: rgba(0,230,118,0.9); color: #000; }
.toast.warn { background: rgba(255,170,0,0.9); color: #000; }
.toast.err  { background: rgba(255,31,31,0.9);  color: #fff; }

/* bottom nav */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 72px; background: rgba(10,10,10,0.96); backdrop-filter: blur(20px);
  border-top: 1px solid var(--gray3);
  display: flex; align-items: center; justify-content: space-around;
  padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 20;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; flex: 1; padding: 8px 0; }
.nav-item svg { width: 22px; height: 22px; fill: var(--text-muted); }
.nav-label { font-size: 10px; color: var(--text-muted); }
.nav-item.active svg { fill: var(--green); }
.nav-item.active .nav-label { color: var(--green); }
</style>
<link rel="manifest" href="/manifest.json">
<script src="/js/resq-auth.js"></script>
</head>
<body>
<div class="phone">

  <div class="header">
    <a href="/dashboard/index.html" class="back-btn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <div class="header-title">SUPPLY <span>TRACKER</span></div>
    <button class="add-btn" onclick="openAddOverlay()">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabAll"  onclick="switchTab('all')">All</div>
    <div class="tab"        id="tabMine" onclick="switchTab('mine')">Mine</div>
    <div class="tab"        id="tabNet"  onclick="switchTab('network')">Network</div>
  </div>

  <div class="content">
    <div class="summary-bar">
      <div class="sum-card"><div class="sum-icon">🩹</div><div class="sum-label">Medical</div><div class="sum-val" id="sumMedical">—</div></div>
      <div class="sum-card"><div class="sum-icon">💧</div><div class="sum-label">Water</div><div class="sum-val"   id="sumWater">—</div></div>
      <div class="sum-card"><div class="sum-icon">🥫</div><div class="sum-label">Food</div><div class="sum-val"    id="sumFood">—</div></div>
      <div class="sum-card"><div class="sum-icon">🔦</div><div class="sum-label">Power</div><div class="sum-val"   id="sumPower">—</div></div>
    </div>
    <div id="cardArea"></div>
  </div>

  <!-- Add / Edit overlay -->
  <div class="overlay-backdrop" id="overlayBackdrop">
    <div class="overlay-sheet">
      <div class="sheet-title" id="sheetTitle">ADD <span>RESOURCE</span></div>

      <div class="form-field">
        <div class="form-label">Resource Name</div>
        <input class="form-input" id="fName" type="text" placeholder="e.g. Bandages, Water Bottles, Rice Bags…">
      </div>

      <div class="form-row">
        <div class="form-field">
          <div class="form-label">Category</div>
          <select class="form-input" id="fType">
            <option value="medical">🩹 Medical</option>
            <option value="water">💧 Water</option>
            <option value="food">🥫 Food</option>
            <option value="power">🔦 Power</option>
            <option value="shelter">🏠 Shelter</option>
            <option value="equipment">🔧 Equipment</option>
            <option value="communication">📡 Comms</option>
            <option value="other">📦 Other</option>
          </select>
        </div>
        <div class="form-field">
          <div class="form-label">Quantity</div>
          <input class="form-input" id="fQty" type="number" min="0" placeholder="0" inputmode="numeric">
        </div>
      </div>

      <div class="form-field">
        <div class="form-label">Unit (optional)</div>
        <input class="form-input" id="fUnit" type="text" placeholder="units, liters, pcs, doses, meals…">
      </div>

      <div class="form-field">
        <div class="form-label">Status</div>
        <div class="status-row">
          <div class="status-pill sel-OK" id="spOK"       onclick="pickStatus('OK')">OK</div>
          <div class="status-pill"        id="spLOW"      onclick="pickStatus('LOW')">LOW</div>
          <div class="status-pill"        id="spCRITICAL" onclick="pickStatus('CRITICAL')">CRITICAL</div>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitResource()">ADD RESOURCE</button>
      <div class="cancel-link" onclick="closeOverlay()">Cancel</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <a href="/dashboard/index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span class="nav-label">Home</span>
    </a>
    <a href="/messaging/index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <span class="nav-label">Messages</span>
    </a>
    <a href="/map/index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      <span class="nav-label">Map</span>
    </a>
    <a href="/resources/index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span class="nav-label">Resources</span>
    </a>
    <a href="/settings/index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5zm7.43-2.02c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.12.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65z"/></svg>
      <span class="nav-label">Settings</span>
    </a>
  </div>

</div>

<script>
// ── Offline-first storage (NO backend — works fully offline) ─────────────────
const STORE_KEY = 'resq_resources';

const MY_ID    = localStorage.getItem('resq_uid')    || ('me_' + Math.random().toString(36).slice(2,7));
const MY_NAME  = localStorage.getItem('resq_name')   || 'Me';
const MY_PHONE = localStorage.getItem('resq_mobile') || null;

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
  catch (_) { return []; }
}
function saveStore(list) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (_) {}
}

// ── State ───────────────────────────────────────────────────────────────────
let _resources      = loadStore();
let _currentTab     = 'all';
let _editingId      = null;
let _selectedStatus = 'OK';

// ── Type display map ────────────────────────────────────────────────────────
const TYPE_META = {
  medical:       { icon: '🩹', color: '#FF1F1F' },
  water:         { icon: '💧', color: '#2979FF' },
  food:          { icon: '🥫', color: '#FFAA00' },
  power:         { icon: '🔦', color: '#FFD600' },
  shelter:       { icon: '🏠', color: '#00E676' },
  equipment:     { icon: '🔧', color: '#78909C' },
  communication: { icon: '📡', color: '#AB47BC' },
  other:         { icon: '📦', color: '#546E7A' },
};
function meta(type) { return TYPE_META[type] || { icon: '📦', color: '#546E7A' }; }

// ── Toast ───────────────────────────────────────────────────────────────────
let _tt;
function showToast(msg, kind) {
  clearTimeout(_tt);
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.textContent = msg;
  document.body.appendChild(el);
  _tt = setTimeout(() => el.remove(), 2800);
}

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ── Load (fully local — instant, no network) ─────────────────────────────────
function loadResources() {
  _resources = loadStore();
  render();
}

// ── Render ──────────────────────────────────────────────────────────────────
function visible() {
  if (_currentTab === 'mine')    return _resources.filter(r => ownId(r) === MY_ID);
  if (_currentTab === 'network') return _resources.filter(r => ownId(r) !== MY_ID);
  return _resources;
}

function ownId(r) {
  if (r.ownerId && typeof r.ownerId === 'object') return r.ownerId._id;
  return r.ownerId;
}

function render() {
  // Update summary bar
  ['medical','water','food','power'].forEach((cat, i) => {
    const items = _resources.filter(r => r.type === cat);
    const el = document.getElementById(['sumMedical','sumWater','sumFood','sumPower'][i]);
    if (!items.length) { el.textContent = '—'; el.className = 'sum-val'; return; }
    const worst = items.find(r => r.status === 'CRITICAL') || items.find(r => r.status === 'LOW') || items[0];
    el.textContent = worst.status;
    el.className = 'sum-val ' + worst.status.toLowerCase();
  });

  // Build cards
  const area = document.getElementById('cardArea');
  const list  = visible();
  if (!list.length) {
    area.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📦</div>
      <div class="empty-title">No resources here</div>
      <div class="empty-sub">Tap <strong>+</strong> to add what you have — food, medicine, water, power.<br>Resources are shared over the local mesh network.</div>
    </div>`;
    return;
  }

  area.innerHTML = '';
  list.forEach(r => area.appendChild(buildCard(r)));
}

function buildCard(r) {
  const isMine = (ownId(r) === MY_ID);
  const m   = meta(r.type);
  const qty = r.quantity || 0;
  const pct = Math.min(100, qty > 0 ? (qty / Math.max(qty * 2, 100)) * 100 : 0);
  const barColor = r.status === 'CRITICAL' ? 'var(--red)' : r.status === 'LOW' ? 'var(--amber)' : 'var(--green)';
  const ownerName  = isMine ? 'You' : (r.ownerName || 'Network user');
  const ownerPhone = r.ownerPhone ? ' · ' + r.ownerPhone : '';

  const el = document.createElement('div');
  el.className = 'res-card' + (isMine ? ' mine' : '');
  el.innerHTML = `
    <div class="res-top">
      <div class="res-icon" style="background:${m.color}22">${m.icon}</div>
      <div class="res-info">
        <div class="res-name">${escHtml(r.name)}</div>
        <div class="res-meta">${escHtml(r.type)} · ${escHtml(ownerName)}${escHtml(ownerPhone)}</div>
      </div>
      <div class="res-status ${r.status}">${r.status}</div>
    </div>
    <div class="res-qty-row">
      <div class="res-qty-bar-wrap">
        <div class="res-qty-bar" style="width:${pct}%;background:${barColor}"></div>
      </div>
      <div class="res-qty-text">${qty} ${escHtml(r.unit || 'units')}</div>
    </div>
    <div class="res-actions">
      ${isMine
        ? `<button class="res-btn edit"   onclick="openEditOverlay('${r._id}')">✏️ Edit</button>
           <button class="res-btn delete" onclick="confirmDelete('${r._id}')">🗑 Delete</button>`
        : `<button class="res-btn request" onclick="requestResource('${escHtml(r.name)}')">📢 Request</button>`
      }
    </div>`;
  return el;
}

// ── Tab ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  _currentTab = tab;
  document.getElementById('tabAll').classList.toggle('active',  tab === 'all');
  document.getElementById('tabMine').classList.toggle('active', tab === 'mine');
  document.getElementById('tabNet').classList.toggle('active',  tab === 'network');
  render();
}

// ── Overlay open/close ───────────────────────────────────────────────────────
function openAddOverlay() {
  _editingId = null;
  document.getElementById('sheetTitle').innerHTML = 'ADD <span>RESOURCE</span>';
  document.getElementById('fName').value = '';
  document.getElementById('fQty').value  = '';
  document.getElementById('fUnit').value = '';
  document.getElementById('fType').value = 'medical';
  document.getElementById('submitBtn').textContent = 'ADD RESOURCE';
  pickStatus('OK');
  document.getElementById('overlayBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 300);
}

function openEditOverlay(id) {
  const r = _resources.find(x => x._id === id);
  if (!r) return;
  _editingId = id;
  document.getElementById('sheetTitle').innerHTML = 'EDIT <span>RESOURCE</span>';
  document.getElementById('fName').value = r.name;
  document.getElementById('fType').value = r.type;
  document.getElementById('fQty').value  = r.quantity;
  document.getElementById('fUnit').value = r.unit || '';
  document.getElementById('submitBtn').textContent = 'SAVE CHANGES';
  pickStatus(r.status || 'OK');
  document.getElementById('overlayBackdrop').classList.add('open');
}

function closeOverlay() {
  document.getElementById('overlayBackdrop').classList.remove('open');
  _editingId = null;
}

document.getElementById('overlayBackdrop').addEventListener('click', function(e) {
  if (e.target === this) closeOverlay();
});

// ── Status pills ─────────────────────────────────────────────────────────────
function pickStatus(s) {
  _selectedStatus = s;
  ['OK','LOW','CRITICAL'].forEach(v => {
    document.getElementById('sp' + v).className =
      'status-pill' + (v === s ? ' sel-' + v : '');
  });
}

// ── Submit (add or update) — saves locally + broadcasts over mesh ────────────
function submitResource() {
  const name = document.getElementById('fName').value.trim();
  const type = document.getElementById('fType').value;
  const qty  = parseFloat(document.getElementById('fQty').value) || 0;
  const unit = document.getElementById('fUnit').value.trim() || 'units';

  if (!name) { showToast('Enter a resource name', 'warn'); return; }

  const now = Date.now();
  let resource;

  if (_editingId) {
    const idx = _resources.findIndex(x => x._id === _editingId);
    if (idx < 0) { showToast('Not found', 'err'); return; }
    resource = { ..._resources[idx], name, type, quantity: qty, unit, status: _selectedStatus, updatedAt: now };
    _resources[idx] = resource;
  } else {
    resource = {
      _id:       'res_' + MY_ID + '_' + now,
      name, type, quantity: qty, unit, status: _selectedStatus,
      ownerId:   MY_ID,
      ownerName: MY_NAME,
      ownerPhone: MY_PHONE,
      updatedAt: now,
    };
    _resources.unshift(resource);
  }

  saveStore(_resources);
  closeOverlay();
  render();
  showToast(_editingId ? name + ' updated' : qty + ' ' + unit + ' of ' + name + ' added');

  // Broadcast the change over the BT mesh so every nearby device updates
  broadcastResourceChange('upsert', resource);

  _editingId = null;
}

// ── Delete — removes locally + broadcasts deletion over mesh ─────────────────
function confirmDelete(id) {
  const r = _resources.find(x => x._id === id);
  if (!r) return;
  if (!confirm('Delete "' + r.name + '"?\n\nThis cannot be undone.')) return;

  _resources = _resources.filter(x => x._id !== id);
  saveStore(_resources);
  render();
  showToast(r.name + ' deleted');

  broadcastResourceChange('delete', { _id: id });
}

// ── Request (broadcasts a chat message over mesh) ────────────────────────────
function requestResource(name) {
  const mesh = window.RESQ_BTMesh || window.RESQ_Mesh;
  if (mesh && mesh.sendBroadcast) {
    mesh.sendBroadcast('📢 RESOURCE REQUEST: I need ' + name + ' — please reply if you can share.');
    showToast('Request broadcast to mesh');
  } else {
    showToast('Mesh starting — try again in a moment', 'warn');
  }
}

// ── Mesh broadcast + receive (keeps every device's list in sync) ─────────────
function broadcastResourceChange(action, resource) {
  const mesh = window.RESQ_BTMesh || window.RESQ_Mesh;
  if (mesh && mesh.broadcastResource) {
    mesh.broadcastResource({ action, resource });
  }
}

function onMeshResource(payload) {
  if (!payload || !payload.action) return;

  if (payload.action === 'upsert' && payload.resource) {
    const incoming = payload.resource;
    if (!incoming._id) return;
    const idx = _resources.findIndex(x => x._id === incoming._id);
    if (idx >= 0) {
      // Last-write-wins by updatedAt
      if ((incoming.updatedAt || 0) >= (_resources[idx].updatedAt || 0)) {
        _resources[idx] = incoming;
      }
    } else {
      _resources.unshift(incoming);
    }
    saveStore(_resources);
    render();
    showToast('📦 ' + (incoming.ownerName || 'Someone') + ' shared ' + incoming.name);
  } else if (payload.action === 'delete' && payload.resource && payload.resource._id) {
    const before = _resources.length;
    _resources = _resources.filter(x => x._id !== payload.resource._id);
    if (_resources.length !== before) { saveStore(_resources); render(); }
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
function wireMeshResources() {
  const mesh = window.RESQ_BTMesh || window.RESQ_Mesh;
  if (!mesh || !mesh.on) { setTimeout(wireMeshResources, 300); return; }
  mesh.on('resource', onMeshResource);
}

loadResources();
wireMeshResources();
</script>
